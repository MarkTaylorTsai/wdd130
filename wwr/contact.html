<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Banana</title>

    <meta name="description"
      content="Contact Banana Rafting for reservations, questions, and information about our white water adventures.">

    <meta name="author" content="Mark Tsai">


    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpeg" alt="Rafting company logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-info">
            <h1>Contact Us</h1>

            <div class="contact-details">
                <div>
                    <h2>Banana Rafting</h2>

                    <p>123 River Road</p>
                    <p>Boise, Idaho 83702</p>

                    <p>Phone: (208) 555-0123</p>

                    <p>
                        Email:
                        <a href="mailto:info@bananarafting.com"></a>>
                        info@bananarafting.com
                        </a>
                    </p>
                </div>

                <iframe src="https://www.google.com/maps?q=Boise,+Idaho&output=embed" width="300"
                  height="220" loading="lazy" title="Banana Rafting location"></iframe>
            </div>
        </section>

        <section class="employees">
            <h2>Meet Our Team</h2>

            <div class="employees-grid">

                <figure>
                    <img src="images/employee1.jpg" alt="Banana rafting manager">
                    <figcaption>
                        Alex Johnson - General Manager
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="Banana rafting guide">
                    <figcaption>
                        Sarah Miller - Lead River Guide
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Banana reservations specialist">
                    <figcaption>
                        David Chen - Reservation Specialist
                    </figcaption>
                </figure>
            </div>
        </section>

        <section class="contact-form-section">
            <h2>Send Us a Message</h2>

            <form class="contact-form">
                <div class="form-item">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>

                <div class="form-item">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <fieldset>
                    <legend>Purpose of Message</legend>

                    <label>
                        <input type="radio" name="purpose" value="general-inquiry">
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation-question">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="website-suggestion">
                        Website Suggestion
                    </label>

                </fieldset>

                <div class="form-item">
                    <label for="message">Message:</label>

                    <textarea id="message" name="message" rows="6" required></textarea>
                </div>

                <div class="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 | Banana | Mark Tsai</p>

        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank" rel="noopener">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com" target="_blank" rel="noopener">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://facebook.com" target="_blank" rel="noopener">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
